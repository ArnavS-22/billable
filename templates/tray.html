<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Billable</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f7f4;
      --card: #ffffff;
      --line: #ebebe6;
      --text: #141413;
      --muted: #7a7a73;
      --chip: #f3f3ee;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      background: var(--card);
      color: var(--text);
      font-family: Geist, Inter, ui-sans-serif, system-ui, sans-serif;
      font-size: 13px;
      line-height: 1.4;
      letter-spacing: -0.01em;
    }
    nav {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
    }
    .brand {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.14em;
    }
    .count { color: var(--muted); font-size: 12px; }
    .shell {
      flex: 1;
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      min-height: 0;
    }
    .inbox {
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-right: 1px solid var(--line);
      background: var(--bg);
    }
    .inbox-head {
      flex: 0 0 auto;
      padding: 16px 16px 8px;
      color: var(--muted);
      font-size: 11px;
    }
    .list {
      flex: 1;
      overflow: auto;
      padding: 0 8px 16px;
    }
    .empty {
      color: var(--muted);
      font-size: 13px;
      padding: 28px 12px;
    }
    .item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 12px;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      border-radius: 8px;
      padding: 10px 10px;
      cursor: pointer;
      color: inherit;
      font: inherit;
    }
    .item:hover { background: #fff; }
    .item.active { background: #fff; box-shadow: inset 0 0 0 1px var(--line); }
    .item .who { font-size: 13px; font-weight: 500; }
    .item .what { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .item .hrs { font-size: 12px; color: var(--muted); }
    .detail {
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: auto;
    }
    .detail-empty {
      margin: auto;
      color: var(--muted);
      font-size: 13px;
    }
    .detail-body {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(260px, 0.8fr);
      min-height: 100%;
    }
    .form, .context {
      padding: 20px 24px 28px;
      min-width: 0;
    }
    .context { border-left: 1px solid var(--line); background: var(--bg); }
    .badge {
      display: inline-block;
      font-size: 10px;
      color: var(--muted);
      background: var(--chip);
      border-radius: 999px;
      padding: 3px 8px;
      margin-bottom: 12px;
    }
    label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-top: 12px;
    }
    input, textarea {
      width: 100%;
      margin-top: 4px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
      font-size: 13px;
      color: var(--text);
      outline: none;
    }
    textarea { min-height: 120px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .actions { display: flex; gap: 8px; margin-top: 20px; }
    .confirm, .hold {
      border: 0;
      border-radius: 8px;
      padding: 9px 14px;
      font: 500 12px/1 Geist, Inter, sans-serif;
      cursor: pointer;
    }
    .confirm { background: var(--text); color: #fff; }
    .hold { background: transparent; color: var(--muted); }
    #status { margin-top: 14px; color: var(--muted); font-size: 12px; white-space: pre-wrap; }
    .kicker { color: var(--muted); font-size: 11px; margin: 0 0 8px; }
    .evidence-line {
      margin: 0 0 18px;
      font-size: 13px;
      font-weight: 500;
    }
    .resource {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .resource svg { width: 20px; height: 20px; flex: 0 0 20px; }
    .resource .name { font-size: 13px; font-weight: 500; }
    .resource .app { color: var(--muted); font-size: 11px; }
    @media (max-width: 860px) {
      .shell { grid-template-columns: 1fr; }
      .inbox { border-right: 0; border-bottom: 1px solid var(--line); max-height: 40vh; }
      .detail-body { grid-template-columns: 1fr; }
      .context { border-left: 0; border-top: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <nav>
    <div class="brand">BILLABLE</div>
    <div class="count" id="count"></div>
  </nav>
  <div class="shell">
    <aside class="inbox">
      <div class="inbox-head">Unbilled today</div>
      <div class="list" id="list"></div>
    </aside>
    <main class="detail" id="detail">
      <div class="detail-empty" id="detail-empty" hidden>No unbilled entries.</div>
      <div class="detail-body" id="detail-body">
        <section class="form">
          <span class="badge" id="source"></span>
          <label>Billing narrative</label>
          <textarea id="narrative"></textarea>
          <div class="row">
            <div>
              <label>Hours</label>
              <input id="hours" type="number" step="0.1" />
            </div>
            <div>
              <label>Date</label>
              <input id="date" />
            </div>
          </div>
          <div class="row">
            <div>
              <label>Client</label>
              <input id="client" />
            </div>
            <div>
              <label>Matter number</label>
              <input id="matter_number" />
            </div>
          </div>
          <label>Task type</label>
          <input id="task_type" />
          <div class="actions">
            <button class="confirm" id="confirm">Confirm to billing</button>
            <button class="hold" id="hold">Hold</button>
          </div>
          <div id="status"></div>
        </section>
        <aside class="context">
          <p class="kicker">Evidence</p>
          <p class="evidence-line" id="evidence-line"></p>
          <p class="kicker">Resource</p>
          <div class="resource">
            <span id="resource-icon"></span>
            <div>
              <div class="name" id="resource-name">—</div>
              <div class="app" id="resource-app"></div>
            </div>
          </div>
        </aside>
      </div>
    </main>
  </div>
  <script>
    let selected = 0;
    let entries = [];

    const ICONS = {
      docs: '<svg viewBox="0 0 24 24"><path fill="#4285F4" d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path fill="#A1C2FA" d="M14 2v6h6"/><path fill="#fff" d="M8 13h8v1.4H8zm0 3h8v1.4H8zm0-6h5v1.4H8z"/></svg>',
      sheets: '<svg viewBox="0 0 24 24"><path fill="#0F9D58" d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path fill="#87D3B0" d="M14 2v6h6"/><path fill="#fff" d="M8 12h8v7H8zm1.2 1.2v1.8h2.4v-1.8zm3.6 0v1.8h2.4v-1.8zM9.2 16.2V18h2.4v-1.8zm3.6 0V18h2.4v-1.8z"/></svg>',
      drive: '<svg viewBox="0 0 24 24"><path fill="#3777E3" d="m8.3 4 5.7 10H2.6z"/><path fill="#FFCF63" d="m15.7 4 5.7 10H10z"/><path fill="#0F9D58" d="M2.6 18 8.3 8h11.4L14 18z"/></svg>',
      gmail: '<svg viewBox="0 0 24 24"><path fill="#4285F4" d="M2 6.5V18a2 2 0 0 0 2 2h2V9l6 4.5L18 9v11h2a2 2 0 0 0 2-2V6.5L12 13z"/><path fill="#EA4335" d="M2 6.5 12 13l10-6.5V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2z"/><path fill="#34A853" d="M6 9v11H4a2 2 0 0 1-2-2V8.2z"/><path fill="#FBBC04" d="M20 20h-2V9l4-.8V18a2 2 0 0 1-2 2z"/></svg>',
      slack: '<svg viewBox="0 0 24 24"><path fill="#E01E5A" d="M6.3 12.8A1.9 1.9 0 1 1 4.4 11h1.9z"/><path fill="#36C5F0" d="M11.2 12.8a1.9 1.9 0 1 1-1.9 1.9v-1.9z"/><path fill="#2EB67D" d="M11.2 6.3A1.9 1.9 0 1 1 13.1 4.4v1.9z"/><path fill="#ECB22E" d="M17.7 11.2a1.9 1.9 0 1 1 1.9-1.9h-1.9z"/><path fill="#E01E5A" d="M13.1 12.8h4.6a1.9 1.9 0 0 1 0 3.8h-4.6z"/><path fill="#36C5F0" d="M11.2 13.1v4.6a1.9 1.9 0 0 1-3.8 0v-4.6z"/><path fill="#2EB67D" d="M10.9 11.2H6.3a1.9 1.9 0 0 1 0-3.8h4.6z"/><path fill="#ECB22E" d="M12.8 10.9V6.3a1.9 1.9 0 0 1 3.8 0v4.6z"/></svg>',
    };

    function detectResource(entry) {
      const blob = [
        entry.filename_hint,
        entry.raw_evidence,
        entry.gmail_subject,
        (entry.drive_file || {}).name,
        entry.task_type,
      ].join(" ").toLowerCase();
      if (entry.gmail_subject || (/\b(gmail|inbox|compose)\b/.test(blob) && !/\.(docx?|pdf|xlsx?)\b/.test(blob))) {
        return { icon: "gmail", app: "Gmail", name: entry.gmail_subject || entry.filename_hint || "Email" };
      }
      if (/slack/.test(blob)) {
        return { icon: "slack", app: "Slack", name: entry.filename_hint || "Slack thread" };
      }
      if (/sheet|xlsx|spreadsheet/.test(blob)) {
        return { icon: "sheets", app: "Google Sheets", name: (entry.drive_file || {}).name || entry.filename_hint || "Spreadsheet" };
      }
      if (/doc|docx|markup|nda|draft|document/.test(blob)) {
        return { icon: "docs", app: "Google Docs", name: (entry.drive_file || {}).name || entry.filename_hint || "Document" };
      }
      if (entry.drive_file) {
        return { icon: "drive", app: "Google Drive", name: entry.drive_file.name };
      }
      return { icon: "docs", app: "Document", name: entry.filename_hint || "Untitled" };
    }

    function current() {
      return entries[selected] || null;
    }

    function renderList() {
      const list = document.getElementById("list");
      const count = document.getElementById("count");
      count.textContent = entries.length ? `${entries.length} ${entries.length === 1 ? "entry" : "entries"}` : "";
      if (!entries.length) {
        list.innerHTML = '<div class="empty">No unbilled entries.</div>';
        return;
      }
      list.innerHTML = entries.map((entry, i) => {
        const active = i === selected ? " active" : "";
        const who = entry.client || "Unassigned";
        const matter = entry.matter_number || "—";
        const what = entry.summary || entry.task_type || "Unclassified";
        const when = entry.minutes_ago != null ? `${entry.minutes_ago}m ago` : `${entry.hours}h`;
        return `<button type="button" class="item${active}" data-i="${i}">
          <div>
            <div class="who">${who} · ${matter}</div>
            <div class="what">${what}</div>
          </div>
          <span class="hrs">${when}</span>
        </button>`;
      }).join("");
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => {
          selected = Number(btn.dataset.i);
          fill();
        });
      });
    }

    function fill() {
      renderList();
      const entry = current();
      const empty = document.getElementById("detail-empty");
      const body = document.getElementById("detail-body");
      if (!entry) {
        empty.hidden = false;
        body.hidden = true;
        return;
      }
      empty.hidden = true;
      body.hidden = false;
      document.getElementById("source").textContent = entry.source || "";
      document.getElementById("narrative").value = entry.narrative || "";
      document.getElementById("hours").value = entry.hours;
      document.getElementById("date").value = entry.date;
      document.getElementById("client").value = entry.client || "";
      document.getElementById("matter_number").value = entry.matter_number || "";
      document.getElementById("task_type").value = entry.task_type || "";
      const snippet = (entry.raw_evidence || "").replace(/\s+/g, " ").trim().slice(0, 220);
      document.getElementById("evidence-line").textContent = snippet
        ? `Seen for ${entry.duration_minutes}m: ${snippet}`
        : `Seen for ${entry.duration_minutes}m on ${entry.filename_hint || "an untitled file"}.`;
      const resource = detectResource(entry);
      document.getElementById("resource-icon").innerHTML = ICONS[resource.icon];
      document.getElementById("resource-name").textContent = resource.name;
      document.getElementById("resource-app").textContent = resource.app;
      document.getElementById("status").textContent = "";
    }

    function entryKey(entry) {
      return [entry.filename_hint || "", entry.matter_number || "", entry.task_type || "", entry.source || ""].join("|");
    }

    async function load(keepSelection) {
      const res = await fetch("/api/draft");
      const data = await res.json();
      const next = Array.isArray(data.entries) ? data.entries : data.client ? [data] : [];
      const prevKey = keepSelection && current() ? entryKey(current()) : null;
      const same = JSON.stringify(next.map(entryKey)) === JSON.stringify(entries.map(entryKey));
      if (keepSelection && same) return;
      entries = next;
      if (prevKey) {
        const idx = entries.findIndex((entry) => entryKey(entry) === prevKey);
        selected = idx >= 0 ? idx : 0;
      } else {
        selected = 0;
      }
      fill();
    }

    document.getElementById("confirm").onclick = async () => {
      const entry = current();
      if (!entry) return;
      const body = {
        ...entry,
        narrative: document.getElementById("narrative").value,
        hours: parseFloat(document.getElementById("hours").value),
        date: document.getElementById("date").value,
        client: document.getElementById("client").value,
        matter_number: document.getElementById("matter_number").value,
        task_type: document.getElementById("task_type").value,
      };
      document.getElementById("status").textContent = "Sending to billing…";
      const res = await fetch("/api/release", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (data.verified) {
        document.getElementById("status").textContent =
          "On the invoice ledger.\n" + data.entry.narrative +
          (data.slack_ok ? "\nTeam notified in Slack." : "\nSlack did not post: " + (data.slack_error || ""));
      } else {
        document.getElementById("status").textContent =
          "Write attempted but the ledger read-back did not match.\n" + JSON.stringify(data, null, 2);
      }
    };

    document.getElementById("hold").onclick = () => {
      const entry = current();
      if (!entry) return;
      document.getElementById("status").textContent =
        "Held. This hour is not on any invoice.\n" + (entry.hold_reasons || []).join("\n");
    };

    load(false);
    setInterval(() => load(true), 8000);
  </script>
</body>
</html>
